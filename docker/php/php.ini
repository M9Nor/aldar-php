; Local overrides. Upload and memory limits match the production php.ini.
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000

display_errors = Off
log_errors = On

; Pick up code edits immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
